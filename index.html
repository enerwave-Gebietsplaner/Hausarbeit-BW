<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173a34"><title>Hauskarte BW</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#e9eeeb;color:#18342d}header{height:54px;background:#173a34;color:white;display:flex;align-items:center;padding:0 15px;justify-content:space-between;font-weight:700}#map{height:calc(100dvh - 145px);min-height:280px}.toolbar{display:flex;gap:6px;overflow-x:auto;padding:9px;background:white;min-height:54px}button{border:0;border-radius:9px;background:#176957;color:white;font-size:14px;font-weight:650;padding:11px 12px;white-space:nowrap}button.secondary{background:#e4ebe8;color:#173a34}#message{min-height:37px;background:#f4f7f5;padding:8px 12px;font-size:13px;line-height:19px}#message.error{background:#fff0e9;color:#8c260d}.leaflet-container{background:#d8e0db}.leaflet-popup-content{min-width:220px}.leaflet-popup-content button{margin:3px}.house-number{background:rgba(255,255,255,.92);border:1px solid #555;border-radius:4px;box-shadow:none;color:#111;font-weight:800;font-size:12px;padding:1px 4px;pointer-events:none}.leaflet-popup-content textarea{width:100%;min-height:92px;font:15px system-ui;border:1px solid #aaa;border-radius:7px;padding:8px}.key{font-size:11px;font-weight:400}a{color:inherit}#layerButton{background:#37657c}
</style></head><body><header><span>Hauskarte BW <small class="key">V16</small></span><small class="key">Nur auf diesem Gerät</small></header><div id="map"></div><nav class="toolbar"><button id="loc">◎ Mein Standort</button><button id="load">▣ Häuser laden</button><button id="layerButton">Luftbild</button><button id="drawButton">✎ Skizzieren</button><button class="secondary" id="backup">Sichern</button><button class="secondary" id="restore">Wiederherstellen</button><input id="file" type="file" accept="application/json,.json" hidden></nav><div id="message" role="status" aria-live="polite">Karte bewegen, nah heranzoomen und „Häuser laden“ tippen.</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{'use strict';const msg=document.getElementById('message');function say(s,error=false){msg.textContent=s;msg.classList.toggle('error',error)}if(!window.L){say('Die Kartenbibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und Seite neu laden.',true);return}
const bw=L.latLngBounds([47.45,7.45],[49.85,10.65]);const map=L.map('map',{maxZoom:21,minZoom:8,maxBounds:bw.pad(.15)}).setView([48.832,9.315],15);const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,maxNativeZoom:19,attribution:'© OpenStreetMap-Mitwirkende'}).addTo(map);street.on('tileerror',()=>say('Kartendaten konnten teilweise nicht geladen werden. Internet prüfen.',true));let aerial=null,aerialOn=false;
const polygons=L.featureGroup().addTo(map);let current=[];const KEY='hauskarte-bw-v4';let records={};try{records=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){say('Gespeicherte Daten konnten nicht gelesen werden.',true)}function persist(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){say('Speichern fehlgeschlagen. Bitte Browser-Speicher prüfen.',true);return false}}
function style(id){let s=records[id]?.status;return {color:s==='green'?'#087b35':s==='red'?'#bd2121':'#53616b',weight:2,fillColor:s==='green'?'#22ba57':s==='red'?'#f24747':'#86919b',fillOpacity:.58}}
function openEditor(id,layer,label){const el=document.createElement('div');const h=document.createElement('strong');h.textContent=label?'Haus '+label:'Gebäude markieren';el.append(h,document.createElement('br'));const g=document.createElement('button');g.textContent='✓ Fertig (grün)';const r=document.createElement('button');r.textContent='✕ Nicht angetroffen (rot)';const n=document.createElement('button');n.textContent='Zurücksetzen';n.className='secondary';const t=document.createElement('textarea');t.placeholder='Nicht angetroffene Namen – ein Name pro Zeile';t.value=(records[id]?.names||[]).join('\n');t.style.display=records[id]?.status==='red'?'block':'none';const save=document.createElement('button');save.textContent='Namen speichern';save.style.display=t.style.display;function update(status){if(status){records[id]={...(records[id]||{}),status,updatedAt:new Date().toISOString()}}else delete records[id];persist();layer.setStyle(style(id));t.style.display=save.style.display=status==='red'?'block':'none';say(status==='green'?'Gebäude als erledigt gespeichert.':status==='red'?'Gebäude rot markiert. Namen können eingetragen werden.':'Markierung entfernt.')}g.onclick=()=>{update('green');layer.setStyle(style(id));layer.bringToFront?.();map.closePopup();say('Fertig gespeichert – Gebäude ist grün markiert.');};r.onclick=()=>update('red');n.onclick=()=>update(null);save.onclick=()=>{const names=t.value.split('\n').map(x=>x.trim()).filter(Boolean);records[id]={...(records[id]||{}),status:'red',names,updatedAt:new Date().toISOString()};if(!persist())return;layer.setStyle(style(id));map.closePopup();say(names.length===1?'1 Name lokal gespeichert.':names.length+' Namen lokal gespeichert.');};el.append(document.createElement('br'),g,r,n,document.createElement('br'),t,save);layer.bindPopup(el,{maxWidth:300}).openPopup()}
function render(features){const merged=new Map(current.map(f=>[f.properties.id,f]));for(const f of features)merged.set(f.properties.id,f);current=[...merged.values()];polygons.clearLayers();for(const f of current){const id=f.properties.id;const label=f.properties.housenumber||'';const layer=L.geoJSON(f,{style:style(id),interactive:true});layer.eachLayer(part=>{part.on('click',e=>{L.DomEvent.stopPropagation(e);openEditor(id,part,label)});if(label)part.bindTooltip(label,{permanent:true,direction:'center',className:'house-number',opacity:1})});layer.addTo(polygons)}say(`${features.length} neue Gebäude geladen, ${current.length} insgesamt sichtbar. Tippe auf ein Gebäude, um es zu markieren.`)}
const endpoints=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.nchc.org.tw/api/interpreter','https://overpass.osm.ch/api/interpreter','https://overpass.osm.jp/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.openstreetmap.ru/api/interpreter','https://overpass.openstreetmap.fr/api/interpreter','https://overpass.openstreetmap.ie/api/interpreter','https://overpass.openstreetmap.no/api/interpreter'];let busy=false;
const buildingCache=new Map();
async function fetchBuildings(endpoint,q,signal){const response=await fetch(endpoint,{method:'POST',body:new URLSearchParams({data:q}),signal,cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.elements))throw Error('Ungültige Antwort');return data.elements}
async function fetchFast(q){const controllers=endpoints.map(()=>new AbortController());const failures=[];let settled=false;return new Promise((resolve,reject)=>{let finished=0;const done=()=>{finished++;if(!settled&&finished===endpoints.length){settled=true;reject(Error(failures.join(' / ')||'Keine Gebäudedaten erhalten'))}};endpoints.forEach((endpoint,i)=>{setTimeout(async()=>{if(settled){done();return}const ctrl=controllers[i];const timer=setTimeout(()=>ctrl.abort(),8000);try{const elements=await fetchBuildings(endpoint,q,ctrl.signal);const buildings=elements.filter(x=>x.type==='way'&&x.geometry?.length>=4);if(buildings.length){if(!settled){settled=true;controllers.forEach((c,j)=>{if(i!==j)c.abort()});resolve(elements)}}else{failures.push(new URL(endpoint).hostname+': leere Antwort');done()}}catch(e){if(settled)return;failures.push(new URL(endpoint).hostname+': '+(e.name==='AbortError'?'Zeitüberschreitung':e.message));done()}finally{clearTimeout(timer)}},i*350)})})}
async function load(){if(busy)return;if(map.getZoom()<16){say('Bitte näher heranzoomen (mindestens Zoomstufe 16), dann erneut „Häuser laden“ tippen.',true);return}const b=map.getBounds();if(!bw.intersects(b)){say('Die App ist nur für Baden-Württemberg gedacht.',true);return}busy=true;document.getElementById('load').disabled=true;say('Gebäude werden geladen …');const q=`[out:json][timeout:20];way["building"](${b.getSouth().toFixed(6)},${b.getWest().toFixed(6)},${b.getNorth().toFixed(6)},${b.getEast().toFixed(6)});out geom;`;const cacheKey=[b.getSouth().toFixed(3),b.getWest().toFixed(3),b.getNorth().toFixed(3),b.getEast().toFixed(3)].join(':');try{let elements=buildingCache.get(cacheKey);if(!elements){elements=await fetchFast(q);if(elements.some(x=>x.type==='way'&&x.geometry?.length>=4))buildingCache.set(cacheKey,elements);if(buildingCache.size>15)buildingCache.delete(buildingCache.keys().next().value)}const features=elements.filter(x=>x.type==='way'&&x.geometry?.length>=4).map(x=>({type:'Feature',properties:{id:'way/'+x.id,housenumber:(x.tags&&x.tags['addr:housenumber'])||''},geometry:{type:'Polygon',coordinates:[x.geometry.map(p=>[p.lon,p.lat])]}}));render(features);if(!features.length)say('Keine Gebäude gefunden. Bitte näher heranzoomen oder Karte verschieben.')}catch(e){say('Gebäude konnten nicht geladen werden: '+e.message+'. Bitte erneut versuchen.',true)}finally{busy=false;document.getElementById('load').disabled=false}}
const locBtn=document.getElementById('loc');const loadBtn=document.getElementById('load');loadBtn.addEventListener('click',()=>{say('Taste erkannt. Gebäude werden vorbereitet …');setTimeout(()=>load(),30)});
locBtn.addEventListener('click',()=>{if(!navigator.geolocation){say('Standortfunktion ist in diesem Browser nicht verfügbar.',true);return}say('Standort wird ermittelt …');navigator.geolocation.getCurrentPosition(p=>{const point=[p.coords.latitude,p.coords.longitude];if(!bw.contains(point)){say('Standort liegt außerhalb von Baden-Württemberg.',true);return}map.setView(point,18);L.circleMarker(point,{radius:8,color:'#fff',weight:3,fillColor:'#006fe6',fillOpacity:1}).addTo(map).bindPopup('Mein Standort');say('Standort gefunden. Jetzt „Häuser laden“ tippen.');},e=>{let reason=e.code===1?'Standortzugriff verweigert. Bitte in den Browser-Einstellungen für diese Website erlauben.':e.code===2?'Standort derzeit nicht verfügbar. Bitte GPS aktivieren.':'Standortabfrage dauerte zu lange. Bitte erneut versuchen.';say(reason,true)},{enableHighAccuracy:true,timeout:15000,maximumAge:15000})});

const DRAWKEY='hauskarte-bw-skizzen-v1';const sketches=L.featureGroup().addTo(map);let drawMode=false,drawing=false,drawPoints=[],drawLine=null;
function saveSketches(){try{const all=[];sketches.eachLayer(l=>{if(l.getLatLngs)all.push(l.getLatLngs().map(p=>[p.lat,p.lng]))});localStorage.setItem(DRAWKEY,JSON.stringify(all))}catch(e){}}
try{for(const pts of JSON.parse(localStorage.getItem(DRAWKEY)||'[]'))L.polyline(pts,{color:'#ff8a00',weight:5,opacity:.9}).addTo(sketches)}catch(e){}
const drawBtn=document.getElementById('drawButton');
function setDrawMode(on){drawMode=on;drawBtn.textContent=on?'✓ Skizzieren fertig':'✎ Skizzieren';drawBtn.style.background=on?'#b85c00':'';if(on){map.dragging.disable();map.doubleClickZoom.disable();say('Skizzieren aktiv: Mit dem Finger direkt auf der Karte zeichnen. Danach „Skizzieren fertig“ tippen.')}else{drawing=false;drawPoints=[];drawLine=null;map.dragging.enable();map.doubleClickZoom.enable();say('Skizze gespeichert. Gebäude können wieder normal angetippt werden.')}}
drawBtn.onclick=()=>setDrawMode(!drawMode);
const mapEl=map.getContainer();
function pointFromEvent(e){const t=e.touches?e.touches[0]:e;const r=mapEl.getBoundingClientRect();return map.containerPointToLatLng(L.point(t.clientX-r.left,t.clientY-r.top))}
function drawStart(e){if(!drawMode)return;e.preventDefault();drawing=true;drawPoints=[pointFromEvent(e)];drawLine=L.polyline(drawPoints,{color:'#ff8a00',weight:5,opacity:.9}).addTo(sketches)}
function drawMove(e){if(!drawMode||!drawing)return;e.preventDefault();drawPoints.push(pointFromEvent(e));drawLine.setLatLngs(drawPoints)}
function drawEnd(e){if(!drawMode||!drawing)return;e.preventDefault();drawing=false;if(drawPoints.length<2&&drawLine)sketches.removeLayer(drawLine);else saveSketches();drawPoints=[];drawLine=null}
mapEl.addEventListener('touchstart',drawStart,{passive:false});mapEl.addEventListener('touchmove',drawMove,{passive:false});mapEl.addEventListener('touchend',drawEnd,{passive:false});mapEl.addEventListener('mousedown',drawStart);mapEl.addEventListener('mousemove',drawMove);window.addEventListener('mouseup',drawEnd);
document.getElementById('layerButton').onclick=()=>{const btn=document.getElementById('layerButton');if(aerialOn){if(aerial)map.removeLayer(aerial);street.addTo(map);aerialOn=false;btn.textContent='Luftbild';say('Straßenkarte eingeschaltet.');return}if(!aerial){aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:19,attribution:'Tiles © Esri, Maxar, Earthstar Geographics und weitere'});let errors=0;aerial.on('tileload',()=>{errors=0});aerial.on('tileerror',()=>{if(++errors>=3&&aerialOn){map.removeLayer(aerial);street.addTo(map);aerialOn=false;btn.textContent='Luftbild';say('Luftbild konnte nicht geladen werden. Straßenkarte wiederhergestellt.',true)}})}map.removeLayer(street);aerial.addTo(map);aerialOn=true;btn.textContent='Straßenkarte';say('Luftbild wird geladen.')}
document.getElementById('backup').onclick=()=>{const payload={app:'Hauskarte BW',version:9,createdAt:new Date().toISOString(),records};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='hauskarte-bw-sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);say('Sicherung wurde zum Download angeboten.')};document.getElementById('restore').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const d=JSON.parse(await f.text());if(d.app!=='Hauskarte BW'||!d.records||typeof d.records!=='object'||Array.isArray(d.records))throw Error('Falsches Sicherungsformat');if(!confirm('Vorhandene Markierungen durch diese Sicherung ersetzen?'))return;records=d.records;if(!persist())return;render(current);say('Sicherung wiederhergestellt.')}catch(e){say('Wiederherstellen fehlgeschlagen: '+e.message,true)}finally{e.target.value=''}};
map.on('moveend',()=>{if(map.getZoom()>=16&&!busy){say('Kartenausschnitt gewählt. „Häuser laden“ tippen.')}});if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});caches?.keys?.().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{})}
})();</script></body></html>
