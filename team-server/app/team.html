<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hauskarte BW Team</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script src="motivation.js" defer></script>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#173a34">
<style>
/* Layout: App-Rahmen wie die Hauskarte – grüne Kopfzeile, Reiter darunter, Inhalt in einer Spalte (max. 760px) */
:root {
  --brand: #173a34; --brand-2: #1f5a4f; --accent: #22ba57; --accent-ink: #087b35;
  --bg: #e9eeeb; --card: #ffffff; --fg: #18342d; --muted: #5d716b; --line: #d3ddd8;
  --bubble-me: #d9f2e3; --bubble: #ffffff; --warn: #b45309; --danger: #bd2121; --info: #1d4ed8;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1d1a; --card: #172925; --fg: #e3eee9; --muted: #9db3ab; --line: #2a403a;
  --bubble-me: #1d4a38; --bubble: #1d322d; --accent-ink: #5fd68a; --warn: #f0a24b; --danger: #ff7a7a; --info: #8fb2ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1d1a; --card: #172925; --fg: #e3eee9; --muted: #9db3ab; --line: #2a403a;
  --bubble-me: #1d4a38; --bubble: #1d322d; --accent-ink: #5fd68a; --warn: #f0a24b; --danger: #ff7a7a; --info: #8fb2ff; color-scheme: dark }
html, body { height: 100% }
body { margin: 0 }
[hidden] { display: none !important }
img { max-width: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; display: flex; flex-direction: column }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand) }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.wrap { width: 100%; max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box }

/* Kopf + Navigation */
header.top { background: var(--brand); color: #fff; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px 6px }
.title { font-weight: 750; font-size: 17px; white-space: nowrap }
.title small { font-weight: 400; opacity: .75; font-size: 12px; margin-left: 4px }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0 }
.me select { background: rgba(255,255,255,.14); border: 0; border-radius: 10px; padding: 4px 8px; color: #fff; max-width: 170px }
.me select option { color: #000 }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding-block: 0 6px }
nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; color: rgba(255,255,255,.78); text-decoration: none; font-size: 12.5px; font-weight: 600; position: relative }
nav.tabs a svg { width: 22px; height: 22px }
nav.tabs a.on { background: rgba(255,255,255,.16); color: #fff }
nav.tabs a.glow { color: #fff; background: rgba(255,184,0,.24); box-shadow: inset 0 0 0 1.5px rgba(255,196,0,.9); animation: hkglow 1.8s ease-in-out infinite }
@keyframes hkglow { 50% { background: rgba(255,184,0,.45) } }
@media (prefers-reduced-motion: reduce) { nav.tabs a.glow { animation: none } }
.dot { position: absolute; top: 4px; right: calc(50% - 20px); width: 11px; height: 11px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px #173a34 }
.badge { position: absolute; top: 2px; right: calc(50% - 22px); background: var(--danger); color: #fff; border-radius: 9px; font-size: 11px; min-width: 18px; height: 18px; line-height: 18px; text-align: center; padding: 0 4px; box-sizing: border-box }
.demo-bar { background: #fff3cd; color: #5c4400; font-size: 12.5px }
.demo-bar .wrap { padding-block: 6px }

main { flex: 1; min-height: 0; overflow-y: auto }
section.view { padding-block: 14px 24px; display: flex; flex-direction: column; gap: 12px }
h2 { margin: 0; font-size: 19px; text-wrap: balance }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px }
.muted { color: var(--muted); font-size: 13px }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.btn { border: 0; border-radius: 10px; padding: 11px 14px; font-weight: 650; background: var(--brand-2); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none }
.btn.big { padding: 15px; font-size: 16px; width: 100% }
.btn.green { background: var(--accent-ink) }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line) }
.btn.danger { background: var(--danger) }
.btn.zoom { background: #2d8cff }
.callcard { background: linear-gradient(135deg, #173a34, #1f5246); color: #fff; border: 0; gap: 8px }
.callcard .lbl { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #9fe3b8; display: flex; align-items: center; gap: 8px }
.callcard .when { font-size: 21px; font-weight: 750; line-height: 1.25 }
.callcard .sub { font-size: 13.5px; color: rgba(255,255,255,.78) }
.callcard .live { background: #f24747; color: #fff; border-radius: 8px; padding: 2px 8px; font-size: 11.5px; letter-spacing: 0; animation: pulse 1.6s infinite }
.callcard .edit { background: rgba(255,255,255,.14); color: #fff; border: 0; margin-left: auto; padding: 7px 11px; font-size: 13px }
.callcard .top { display: flex; align-items: center; gap: 8px }
.callcard .join { width: auto; align-self: stretch; box-sizing: border-box; margin-top: 4px }
@keyframes pulse { 50% { opacity: .55 } }
@media (prefers-reduced-motion: reduce) { .callcard .live { animation: none } }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px } .seg label { border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; font-weight: 650; cursor: pointer } .seg input { position: absolute; opacity: 0; pointer-events: none } .seg label:has(input:checked) { background: var(--accent-ink); color: #fff; border-color: var(--accent-ink) }
.btn:disabled { opacity: .5; cursor: default }
.btn svg { width: 20px; height: 20px }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); flex: 1; min-width: 140px }
label.f input, label.f select { font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--fg) }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 14px }
.empty { text-align: center; color: var(--muted); padding: 26px 10px }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: 0 0 auto; font-size: 15px }

/* Chat */
#view-chat { height: 100%; padding-block: 0; gap: 0 }
.chat-list { display: flex; flex-direction: column; gap: 8px; padding-block: 14px }
.ch { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; text-align: left; width: 100% }
.ch .t { flex: 1; min-width: 0 }
.ch .t b { display: block }
.ch .t span { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.ch .n { background: var(--accent-ink); color: #fff; border-radius: 10px; font-size: 12px; padding: 2px 7px; font-weight: 700 }
.conv { display: flex; flex-direction: column; height: 100% }
.conv-head { display: flex; align-items: center; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line) }
.conv-head b { flex: 1; min-width: 0 }
.msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-block: 12px }
.day { align-self: center; font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 2px 10px; margin: 6px 0 }
.m { max-width: 82%; align-self: flex-start; background: var(--bubble); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 7px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.m.me { align-self: flex-end; background: var(--bubble-me); border-radius: 14px 14px 4px 14px }
.m .who { font-size: 12.5px; font-weight: 700; display: flex; gap: 8px; justify-content: space-between }
.m .who time { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums }
.m .txt { white-space: pre-wrap; overflow-wrap: anywhere }
.m img { border-radius: 9px; max-height: 240px; object-fit: cover; cursor: zoom-in; background: var(--line) }
.file { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.05); border-radius: 9px; padding: 8px; text-decoration: none; color: var(--fg) }
.file svg { width: 26px; height: 26px; flex: 0 0 auto; color: var(--danger) }
.file span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.file small { color: var(--muted); white-space: nowrap }
.composer { display: flex; gap: 8px; align-items: flex-end; padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line) }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 20px; padding: 10px 14px; font-size: 16px; max-height: 120px; background: var(--card) }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--card); color: var(--fg); border: 1px solid var(--line); flex: 0 0 auto }
.icon-btn.send { background: var(--accent-ink); color: #fff; border: 0 }
.icon-btn svg { width: 22px; height: 22px }
.pending { display: flex; align-items: center; gap: 8px; font-size: 13px; padding-top: 8px }
.pending img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px }

/* Team */
.person { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; width: 100%; text-align: left }
.person .t { flex: 1; min-width: 0 }
.pill { font-size: 11.5px; font-weight: 700; border-radius: 8px; padding: 2px 7px; background: rgba(29,78,216,.12); color: var(--info) }
.access { display: flex; gap: 22px; flex-wrap: wrap } .access > div { display: flex; flex-direction: column; gap: 2px } .access b { font-size: 18px } .access .pinbig { font-size: 26px; letter-spacing: 4px; font-variant-numeric: tabular-nums }
.steps { margin: 4px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px }
.pill.off { background: rgba(189,33,33,.12); color: var(--danger) }
.sheet { position: fixed; inset: 0; background: rgba(10,30,25,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20 }
.sheet .panel { background: var(--bg); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; max-height: 88%; overflow-y: auto; box-sizing: border-box }
.confirm { background: rgba(189,33,33,.08); border: 1px solid var(--danger); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px }

/* Dashboard */
.month { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.month b { font-size: 17px }
.total { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap }
.total .big { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1 }
.bar { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .4s }
.rank { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 10px; align-items: center }
.rank .nm { font-weight: 600; min-width: 0 }
.rank .ct { font-variant-numeric: tabular-nums; font-weight: 750; text-align: right }
.rank .bar { grid-column: 2 / 4; height: 6px; margin-top: -4px }
.mine li { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line) }
.mine { list-style: none; margin: 0; padding: 0 }
.dcard { gap: 12px }
.dhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.dico { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; background: rgba(34,186,87,.14); color: var(--brand-2); display: grid; place-items: center } .dico svg { width: 24px; height: 24px }
.dtt { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 1px } .dtt b { font-size: 18px } .dtt .muted { font-size: 13.5px }
.mnav { display: flex; align-items: center; gap: 2px; font-size: 13px; color: var(--muted); font-weight: 650 } .mnav .icon-btn { width: 32px; height: 32px } .mnav .icon-btn svg { width: 16px; height: 16px } .mnav .icon-btn:disabled { opacity: .3 }
.stepper { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 12px }
.stepbtn { height: 64px; border-radius: 16px; border: 0; font-size: 34px; font-weight: 700; line-height: 1; background: var(--line); color: var(--fg); cursor: pointer }
.stepbtn.plus { background: var(--accent-ink); color: #fff }
.stepbtn:disabled { opacity: .35; cursor: default }
.stepval { display: flex; align-items: baseline; justify-content: center; gap: 8px; color: var(--muted); font-weight: 650 }
.stepval .n { font-size: 46px; font-weight: 800; color: var(--fg); font-variant-numeric: tabular-nums; line-height: 1 }
.stepval.past { justify-content: flex-start }
#contractNote { font-size: 15px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--fg) }
.tc { display: flex; flex-direction: column; gap: 4px }
.tch, .tcr { display: grid; grid-template-columns: 34px minmax(0, 1fr) 70px minmax(90px, 150px) 56px; align-items: center; gap: 8px; padding: 6px 8px }
.tc.past .tch, .tc.past .tcr { grid-template-columns: 34px minmax(0, 1fr) 70px }
.tch { font-size: 12.5px; color: var(--muted); font-weight: 650; padding-bottom: 2px }
.tcr { border-radius: 10px; padding: 8px }
.tcr:nth-child(even) { background: var(--bg) }
.tcr.me { box-shadow: inset 0 0 0 1.5px var(--accent-ink) }
.tch .sm { display: none } @media (max-width: 520px) { .tch .lg { display: none } .tch .sm { display: inline } }
.tc .c { text-align: center; font-variant-numeric: tabular-nums } .tch > span:nth-child(4) { padding-left: 2px }
.rk { display: flex; align-items: center; gap: 2px; font-weight: 700; font-variant-numeric: tabular-nums } .crown { color: #e7a614; display: inline-flex } .crown svg { width: 18px; height: 18px; fill: #f5b82e }
.who { display: flex; align-items: center; gap: 8px; min-width: 0 } .who b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; font-weight: 650 } .tcr.me .who b { color: var(--accent-ink); font-weight: 750 }
.who .av { width: 34px; height: 34px; font-size: 13px; flex: 0 0 auto }
.today { display: flex; flex-direction: column; gap: 4px } .tv2 { font-variant-numeric: tabular-nums; color: var(--muted) } .tv2 strong { color: var(--accent-ink); font-size: 16px }
.tcb { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden } .tcb i { display: block; height: 100%; background: #6cc68e; border-radius: 4px } .tcr.hit .tcb i { background: var(--accent-ink) }
.tc .month strong { font-size: 16px }
@media (max-width: 520px) { .tch, .tcr { grid-template-columns: 26px minmax(0, 1fr) 40px 76px 44px; gap: 6px } .who .av { width: 28px; height: 28px; font-size: 11px } .who b { font-size: 14px } .tch { font-size: 11px } }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px }
.proj { display: flex; flex-direction: column; gap: 8px; align-items: stretch; text-align: left; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer }
.proj .pt { display: flex; justify-content: space-between; gap: 6px } .proj .pt b { font-size: 16px } .kebab { font-size: 20px; line-height: 1; color: var(--muted) }
.proj .pst { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted) } .proj .pst i { width: 9px; height: 9px; border-radius: 50%; background: #9aa5a1 } .proj .pst.on { color: var(--accent-ink); font-weight: 650 } .proj .pst.on i { background: #22ba57 }
.proj .avs .av { width: 38px; height: 38px; font-size: 14px; border: 2px solid var(--card) } .proj .avs .av.more { background: var(--line); color: var(--fg) }
.proj .pfoot { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted) } .proj .pfoot span { display: inline-flex; align-items: center; gap: 5px } .proj .pfoot svg { width: 16px; height: 16px }
.proj.off { opacity: .6 }
.btn.small { padding: 8px 12px; font-size: 14px } .btn.small svg { width: 18px; height: 18px }
.dtabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px }
.dtabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700; padding: 10px; border-radius: 9px; cursor: pointer }
.dtabs button.on { background: var(--brand-2); color: #fff }
.proj { text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100% }
.proj .ph { display: flex; align-items: center; gap: 8px; justify-content: space-between }
.proj .ph b { font-size: 17px }
.proj.off { opacity: .6 }
.pill.on { background: rgba(10,128,60,.14); color: var(--accent-ink) }
.avs { display: flex; flex-wrap: wrap; gap: 4px } .avs .av { width: 30px; height: 30px; font-size: 12px }
.pstats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px } .pstats strong { font-size: 20px; font-variant-numeric: tabular-nums }
.mlist { display: flex; flex-direction: column; max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px }
.mlist label { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer } .mlist label:first-child { border-top: 0 }
.mlist input { width: 20px; height: 20px; accent-color: var(--accent-ink) }
.dg-body { display: flex; gap: 16px; align-items: center } .dg-left { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0 } .dg-right { display: flex; flex-direction: column; align-items: center }
.dg-goal { font-size: 16px } .dg-goal strong { font-weight: 750 }
.daygoal .dg-edit { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; color: var(--fg) } .daygoal .dg-edit svg { width: 18px; height: 18px }
.daygoal { cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100% }
.daygoal .dg-top { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.daygoal .dg-num { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1 }
.daygoal .dg-num small { font-size: 20px; color: var(--muted); font-weight: 700 }
.daygoal .dg-bar { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden }
.daygoal .dg-bar i { display: block; height: 100%; background: var(--accent-ink); border-radius: 6px; transition: width .4s }
.daygoal.done { border-color: var(--accent-ink); box-shadow: inset 0 0 0 1px var(--accent-ink) }
.tvs { display: flex; flex-direction: column }
.tv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line) }
.tv:first-child { border-top: 0 }
.tv .av { grid-row: span 3 }
.tv b { font-size: 15.5px }
.tv .l { font-size: 14px; font-variant-numeric: tabular-nums }
.tv .l strong { font-weight: 750 }
.tv .mb { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; max-width: 240px } .tv .mb i { display: block; height: 100%; background: #7fb8a0 }
.tv.me b { color: var(--accent-ink) } .tv.me .mb i { background: var(--accent-ink) }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--brand); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px) }
.viewer { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: grid; place-items: center; z-index: 40 }
.viewer img { max-width: 96%; max-height: 92% }
.m video { max-width: 100%; max-height: 320px; border-radius: 9px; background: #000 }
.m audio { width: 260px; max-width: 100%; height: 40px }
.voice { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted) }
.voice svg { width: 16px; height: 16px; flex: 0 0 auto }
.icon-btn.mic.rec { background: var(--danger); color: #fff; border: 0 }
.recbar { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; font-variant-numeric: tabular-nums }
.recbar .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--danger); animation: blink 1s infinite }
@keyframes blink { 50% { opacity: .25 } }

    h('div', { class: 'row', style: 'justify-content:space-between' }, h('b', {}, 'Mitarbeiter auswählen'), h('button', { class: 'btn ghost', type: 'button', style: 'padding:6px 10px', onclick: () => { const all = boxes.every(l => l.querySelector('input').checked); boxes.forEach(l => { l.querySelector('input').checked = !all; }); } }, 'Alle / keine')),
    h('div', { class: 'mlist', id: 'projMembers' }, boxes.length ? boxes : h('p', { class: 'muted', style: 'margin:10px' }, 'Noch keine Mitarbeiter angelegt.')),
    h('label', { class: 'chk' }, act, 'Projekt ist aktiv'), err,
    h('div', { class: 'row' }, h('button', { class: 'btn green', type: 'submit', id: 'projSave' }, pr ? 'Speichern' : 'Projekt anlegen'), h('button', { class: 'btn ghost', type: 'button', onclick: () => s.remove() }, 'Abbrechen')));
  form.onsubmit = async e => {
    e.preventDefault();
    const n = name.value.trim(); if (!n) return err.textContent = 'Bitte einen Projektnamen eingeben.';
    const members = boxes.map(l => l.querySelector('input')).filter(c => c.checked).map(c => c.value);
    try { if (pr) await api.updateProject(pr.id, { name: n, members, active: act.checked }); else await api.addProject({ name: n, members, active: act.checked }); s.remove(); toast(pr ? 'Projekt gespeichert.' : 'Projekt „' + n + '“ angelegt.'); renderDashboard(); }
    catch (x) { err.textContent = x.message; }
  };
  s = sheet(form);
}
function dayGoalEditor(t) {
  let s;
  const inp = h('input', { id: 'dayGoalInput', type: 'number', inputmode: 'numeric', min: 1, max: 99, step: 1, value: t.goal || t.lastGoal || '', placeholder: 'z. B. 6' });
  const quick = h('div', { class: 'row' }, [3, 4, 5, 6, 8, 10].map(n => h('button', { class: 'btn ghost', type: 'button', style: 'min-width:48px', onclick: () => { inp.value = n; } }, String(n))));
  const err = h('p', { class: 'muted', role: 'alert', style: 'color:var(--danger);margin:0' });
  const form = h('form', { style: 'display:flex;flex-direction:column;gap:12px' }, h('h2', {}, 'Mein Tagesziel für heute'),
    h('label', { class: 'f' }, 'Wie viele Verträge willst du heute schaffen?', inp), quick, err,
    h('div', { class: 'row' }, h('button', { class: 'btn green', type: 'submit', id: 'dayGoalSave' }, 'Speichern'), h('button', { class: 'btn ghost', type: 'button', onclick: () => s.remove() }, 'Abbrechen'),
      t.goal ? h('button', { class: 'btn ghost', type: 'button', style: 'margin-left:auto;color:var(--danger)', onclick: async () => { await api.setDayGoal(0).catch(() => {}); s.remove(); toast('Tagesziel entfernt.'); renderDashboard(); } }, 'Ziel entfernen') : null),
    h('p', { class: 'muted', style: 'margin:0' }, 'Gilt nur für heute. Morgen startest du wieder bei 0. Dein Team sieht dein Ziel und deinen Stand.'));
  form.onsubmit = async e => {
    e.preventDefault();
    const g = Number(inp.value);
    if (!Number.isInteger(g) || g < 1 || g > 99) return err.textContent = 'Bitte eine Zahl zwischen 1 und 99 eingeben.';
    try { await api.setDayGoal(g); s.remove(); toast('Tagesziel: ' + g + ' ' + (g === 1 ? 'Vertrag' : 'Verträge') + ' – viel Erfolg!'); renderDashboard(); } catch (x) { err.textContent = x.message; }
  };
  s = sheet(form);
}
function goalEditor(d) {
  const inp = h('input', { id: 'goal', type: 'number', min: 0, step: 1, value: d.goal || '', placeholder: 'z. B. 60' });
  return h('div', { class: 'row', style: 'align-items:flex-end' }, h('label', { class: 'f' }, 'Monatsziel für ' + monthName(d.month), inp),
    h('button', { class: 'btn ghost', onclick: async () => { const g = Math.max(0, parseInt(inp.value, 10) || 0); await api.setGoal(d.month, g); toast(g ? 'Monatsziel: ' + g + ' Verträge.' : 'Monatsziel entfernt.'); renderDashboard(); } }, 'Speichern'));
}

boot();
})();
</script>
</body>
</html>
