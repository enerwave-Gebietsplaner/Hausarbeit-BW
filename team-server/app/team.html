<title>Hauskarte BW Team</title>

<style>
/* Layout: Team-Plattform. Breit (Tablet quer/PC): links Hauptbereich + Navigation, rechts Seitenleiste mit Chat, Teamcall, Verträgen.
   Schmal (Handy/Tablet hoch): ein Bereich, Navigation unten. Karten-Kacheln weiß mit weichem Schatten auf hellem Grün-Grau. */
:root {
  --bg: #eaf0ed; --bg-2: #f4f7f5; --card: #ffffff; --soft: #f3f6f4; --fg: #12302a; --muted: #62756f; --line: #e1e8e4;
  --green: #1e9e5a; --green-ink: #13784a; --green-soft: #e3f4ea; --blue: #3b82f6; --blue-soft: #e6efff; --zoom: #2d8cff;
  --red: #ef4444; --red-soft: #fde8e8; --amber: #f59e0b; --violet: #8b5cf6;
  --shadow: 0 1px 2px rgba(18,48,42,.05), 0 8px 28px rgba(18,48,42,.07);
  --r: 20px; --r-sm: 14px;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1916; --bg-2: #101f1b; --card: #15261f; --soft: #1b2f28; --fg: #e4efe9; --muted: #98aea6; --line: #253a33;
  --green-soft: #173f2c; --blue-soft: #1a2a48; --red-soft: #3d1c1c; --green-ink: #4fd18a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1916; --bg-2: #101f1b; --card: #15261f; --soft: #1b2f28; --fg: #e4efe9; --muted: #98aea6; --line: #253a33;
  --green-soft: #173f2c; --blue-soft: #1a2a48; --red-soft: #3d1c1c; --green-ink: #4fd18a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25); color-scheme: dark }
html, body { height: 100% }
body { background: radial-gradient(1200px 600px at 10% -10%, var(--bg-2), transparent 60%), var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; overflow: hidden }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px }
svg.i { width: 22px; height: 22px; flex: 0 0 auto }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 12px; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); box-sizing: border-box; max-width: 1600px; margin: 0 auto }
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow) }

/* Kopfzeile */
.top { display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 18px }
.logo { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 }
.logo .mark { width: 42px; height: 42px; color: var(--green); flex: 0 0 auto }
.logo b { display: block; font-size: 21px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap }
.logo small { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: .14em; color: var(--muted); white-space: nowrap }
.bell { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--fg) }
.bell .n { position: absolute; top: 4px; right: 4px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; box-sizing: border-box }
.user { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 4px 6px; border-radius: 14px; text-align: left; position: relative }
.user .nm b { display: block; font-weight: 700; white-space: nowrap }
.user .nm span { display: block; font-size: 13px; color: var(--muted) }
.user select { position: absolute; inset: 0; opacity: 0; cursor: pointer }

/* Hauptbereich */
.body { min-height: 0; display: grid; gap: 12px; grid-template-columns: 1fr }
.left { min-height: 0; display: grid; grid-template-rows: 1fr auto; gap: 12px }
.main { min-height: 0; overflow: hidden; display: flex; flex-direction: column }
.side { display: none }
@media (min-width: 1000px) {
  .body { grid-template-columns: minmax(0, 1fr) 420px }
  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; padding-bottom: 2px }
}
@media (min-width: 1300px) { .body { grid-template-columns: minmax(0, 1fr) 520px } }

/* Navigation */
.nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 14px; text-decoration: none; color: var(--fg); font-weight: 600; font-size: 14px; position: relative }
.nav a .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center }
.nav a.on { background: var(--green-soft) }
.nav a.on .ic { background: var(--green); color: #fff }
.nav a .n { position: absolute; top: 6px; left: calc(50% + 10px); background: var(--red); color: #fff; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; box-sizing: border-box }

/* Karte (Vorschau-Bild) */
.mapcard { position: relative; overflow: hidden; height: 100% }
.mapcard canvas { width: 100%; height: 100%; display: block }
.mapcard iframe { border: 0; width: 100%; height: 100%; display: block }
.maptag { position: absolute; left: 16px; bottom: 16px; background: rgba(255,255,255,.94); color: #12302a; border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px) }

/* Kopf einer Kachel */
.hd { display: flex; align-items: center; gap: 12px; padding: 16px 18px 10px }
.hd .ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: 0 0 auto }
.hd h2 { margin: 0; font-size: 21px; font-weight: 800; flex: 1; min-width: 0; letter-spacing: -.01em }
.hd .link { border: 0; background: transparent; color: var(--blue); font-weight: 600; display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap }
.pad { padding: 0 18px 18px }

/* Avatare */
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: 0 0 auto; font-size: 16px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.6) }
.av.s { width: 36px; height: 36px; font-size: 14px }

/* Chat */
.msgs { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding: 4px 12px 8px; flex: 1; min-height: 0 }
.msg { display: flex; gap: 10px; padding: 8px; border-radius: 16px; align-items: flex-start }
.msg .b { min-width: 0; flex: 1 }
.msg .who { display: flex; gap: 8px; align-items: baseline }
.msg .who b { font-weight: 700 }
.msg .who time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums }
.msg .txt { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4 }
.msg.me .bub { background: var(--green-soft); border-radius: 14px; padding: 8px 12px; display: inline-flex; flex-direction: column; gap: 6px; max-width: 100% }
.msg .bub { display: flex; flex-direction: column; gap: 6px }
.msg img { max-width: min(320px, 100%); max-height: 220px; border-radius: 12px; object-fit: cover; cursor: zoom-in; background: var(--soft) }
.mini .msgs { background: var(--soft); margin: 0 12px; border-radius: 16px; padding: 6px; max-height: 300px }
.file { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; text-decoration: none; color: var(--fg); max-width: 320px }
.file .fi { width: 34px; height: 40px; border-radius: 6px; background: var(--red-soft); color: var(--red); display: grid; place-items: center; font-size: 10px; font-weight: 800; flex: 0 0 auto }
.file span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600 }
.file small { color: var(--muted); white-space: nowrap; margin-left: auto }
.day { align-self: center; font-size: 12px; color: var(--muted); background: var(--soft); border-radius: 10px; padding: 3px 10px; margin: 8px 0 4px }
.composer { display: flex; gap: 10px; align-items: flex-end; padding: 12px 12px 14px }
.composer .box { flex: 1; display: flex; align-items: flex-end; gap: 4px; background: var(--soft); border-radius: 26px; padding: 4px 6px; min-width: 0 }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; padding: 10px 6px; font-size: 16px; max-height: 120px; outline: none }
.ib { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--muted); flex: 0 0 auto }
.ib.go { background: var(--green); color: #fff; width: 52px; height: 52px; box-shadow: 0 6px 16px rgba(30,158,90,.35) }

.attach-prev { display: flex; align-items: center; gap: 10px; margin: 0 12px; padding: 8px 10px; background: var(--soft); border-radius: 14px; font-size: 13px }
.attach-prev img { width: 44px; height: 44px; object-fit: cover; border-radius: 10px }

.chatfull { display: grid; grid-template-columns: 1fr; height: 100%; min-height: 0 }
.chatfull .list { overflow-y: auto; padding: 6px 10px 12px; display: flex; flex-direction: column; gap: 4px }
.chatfull .conv { display: flex; flex-direction: column; min-height: 0; height: 100% }
.ch { display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 10px; border-radius: 16px; text-align: left; width: 100% }
.ch.on, .ch:hover { background: var(--soft) }
.ch .t { flex: 1; min-width: 0 }
.ch .t b { display: block }
.ch .t span { display: block; color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.ch .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green) }
.sec { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--muted); padding: 12px 10px 4px }
@media (min-width: 760px) { .chatfull { grid-template-columns: 300px 1fr } .chatfull .list { border-right: 1px solid var(--line) } .chatfull .back { display: none } }
@media (max-width: 759px) { .chatfull.open .list { display: none } .chatfull:not(.open) .conv { display: none } }

/* Teamcall */
.zoom { display: flex; align-items: center; gap: 14px; padding: 16px 18px; flex-wrap: wrap }
.zoom .ic { width: 58px; height: 58px; border-radius: 50%; background: #2563eb; color: #fff; display: grid; place-items: center; flex: 0 0 auto }
.zoom .t { flex: 1; min-width: 160px }
.zoom .t b { display: block; font-size: 19px; font-weight: 800 }
.zoom .t span { display: block; color: var(--muted) }
.zoom .t small { display: flex; align-items: center; gap: 6px; color: var(--muted); margin-top: 4px; font-size: 13.5px }
.btn { border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; background: var(--green); color: #fff; font-size: 15px }
.btn.zm { background: #5b9cf6 }
.btn.ghost { background: var(--soft); color: var(--fg) }
.btn.red { background: var(--red) }
.btn.full { width: 100%; box-sizing: border-box }
.btn:disabled { opacity: .5 }

/* Verträge */
.month { display: flex; align-items: center; gap: 4px }
.month .ib { width: 36px; height: 36px; color: var(--fg) }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 18px }
.kpi { border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.kpi.g { background: var(--green-soft); flex-direction: row; align-items: center; gap: 12px }
.kpi.g .num { font-size: 32px; font-weight: 800; color: var(--green-ink); line-height: 1; font-variant-numeric: tabular-nums }
.kpi.g span { color: var(--green-ink); font-weight: 600; font-size: 14px }
.kpi.w { background: var(--soft) }
.kpi .row { display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums }
.kpi .row b { color: var(--green-ink); font-size: 17px }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--green); transition: width .4s }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; padding: 12px 14px 16px }
.tile { border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 4px; position: relative; min-width: 0 }
.tile .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px }
.tile .ct { font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums }
.tile .lb { color: var(--muted); font-size: 13.5px }
.tile .bar { margin-top: 8px; height: 5px }
.tile .numrow { display: flex; align-items: center; justify-content: space-between; gap: 6px }
.tile .plus { width: 38px; height: 38px; border-radius: 50%; border: 0; background: #7fdcb0; color: #fff; display: grid; place-items: center; flex: 0 0 auto }
.tile .plus:hover { background: var(--green) }
.tile.me { outline: 2px solid var(--green); outline-offset: -2px }
.mine { list-style: none; margin: 0; padding: 0 18px 16px; display: flex; flex-direction: column }
.mine li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums }
.note { display: flex; gap: 8px; padding: 0 18px 14px; flex-wrap: wrap }
.note input { flex: 1; min-width: 160px; border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 11px 12px; font-size: 16px }

/* Team */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 4px 18px 18px; overflow-y: auto }
.person { display: flex; align-items: center; gap: 12px; background: var(--soft); border: 0; border-radius: 18px; padding: 12px; text-align: left; width: 100% }
.person .t { flex: 1; min-width: 0 }
.person .t b { display: block }
.person .t span { color: var(--muted); font-size: 13.5px }
.pill { font-size: 12px; font-weight: 700; border-radius: 8px; padding: 3px 8px; background: var(--blue-soft); color: var(--blue) }
.scroll { overflow-y: auto; min-height: 0; flex: 1 }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--muted); font-weight: 600 }
label.f input { font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); color: var(--fg); font-weight: 400 }
label.chk { display: flex; align-items: center; gap: 10px; font-size: 14.5px }
.muted { color: var(--muted); font-size: 13.5px; margin: 0 }
.empty { color: var(--muted); text-align: center; padding: 30px 12px }

.sheet { position: fixed; inset: 0; background: rgba(10,30,25,.4); display: flex; align-items: flex-end; justify-content: center; z-index: 30 }
@media (min-width: 700px) { .sheet { align-items: center } .sheet .panel { border-radius: 22px !important } }
.sheet .panel { background: var(--card); width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 20px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 90%; overflow-y: auto; box-sizing: border-box }
.sheet h3 { margin: 0; font-size: 20px }
.confirm { background: var(--red-soft); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px }
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #12302a; color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 14.5px; z-index: 40; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 32px) }
.toast button { border: 0; background: transparent; color: #7ee2ad; font-weight: 700 }
.viewer { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: grid; place-items: center; z-index: 50 }
.viewer img { max-width: 94%; max-height: 90% }
.demo { background: #fff7e0; color: #5c4400; font-size: 12.5px; padding: 6px 12px; border-radius: 10px; max-width: 360px; line-height: 1.35 }
@media (max-width: 1100px) { .demo { display: none } }
/* Suche oben */
.search { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 10px; background: var(--soft); border-radius: 26px; padding: 0 16px; margin: 0 8px; color: var(--muted) }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 13px 0; font-size: 16px; outline: none; color: var(--fg) }
.user .chev { color: var(--muted) }
.av svg { width: 100%; height: 100%; border-radius: 50%; display: block }
.av.photo { background: transparent !important; box-shadow: 0 0 0 2px var(--card), 0 1px 4px rgba(0,0,0,.15) }
/* Kartenbedienung (schwebend) */
.mctl { position: absolute; display: flex; flex-direction: column; gap: 10px; z-index: 2 }
.mbtn { width: 50px; height: 50px; border-radius: 14px; border: 0; background: #fff; color: #12302a; display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.18) }

.mgroup .mbtn { box-shadow: none; border-radius: 0 }
.mgroup .mbtn + .mbtn { border-top: 1px solid #e6ece9 }
.seg { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 26px; padding: 5px; display: flex; gap: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.18); z-index: 2 }
.seg button { border: 0; background: transparent; color: #12302a; border-radius: 22px; padding: 9px 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 15px }
.seg button.on { background: var(--green); color: #fff }
.tools { position: absolute; right: 16px; top: 16px; background: #fff; border-radius: 18px; padding: 10px 6px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 12px rgba(0,0,0,.18); z-index: 2; max-height: calc(100% - 32px); overflow-y: auto }
.tools button { border: 0; background: transparent; color: #12302a; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; padding: 6px 4px; border-radius: 12px; width: 76px }
.tools button .c { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center }
.tools button.on { background: #e3f4ea }
.scale { position: absolute; left: 20px; bottom: 18px; color: #fff; font-weight: 600; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,.6); z-index: 2 }
.scale i { display: block; width: 160px; height: 8px; border: 2px solid #fff; border-top: 0; margin-top: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.4) }
/* Emoji-Auswahl */
.emo { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 12px 0 }
.emo button { border: 0; background: transparent; font-size: 22px; width: 40px; height: 40px; border-radius: 10px }
.emo button:hover { background: var(--soft) }
@media (max-width: 900px) { .search { display: none } }
@media (max-width: 640px) { .seg { top: auto; bottom: 16px } .scale { display: none } .logo small { display: none } .logo b { font-size: 18px } .user .nm, .user .chev { display: none } .demo { display: none } .seg button span { display: none } .tools button { width: 62px; font-size: 11px } .tools button .c { width: 38px; height: 38px } .mbtn { width: 44px; height: 44px } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none } }
</style>
