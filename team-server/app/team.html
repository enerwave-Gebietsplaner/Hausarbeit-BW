<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon.svg">

<style>
/* Layout: App-Rahmen wie die Hauskarte – grüne Kopfzeile, Reiter darunter, Inhalt in einer Spalte (max. 760px) */
:root {
  --brand: #173a34; --brand-2: #1f5a4f; --accent: #22ba57; --accent-ink: #087b35;
  --bg: #e9eeeb; --card: #ffffff; --fg: #18342d; --muted: #5d716b; --line: #d3ddd8;
  --bubble-me: #d9f2e3; --bubble: #ffffff; --warn: #b45309; --danger: #bd2121; --info: #1d4ed8;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1d1a; --card: #172925; --fg: #e3eee9; --muted: #9db3ab; --line: #2a403a;
  --bubble-me: #1d4a38; --bubble: #1d322d; --accent-ink: #5fd68a; --warn: #f0a24b; --danger: #ff7a7a; --info: #8fb2ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1d1a; --card: #172925; --fg: #e3eee9; --muted: #9db3ab; --line: #2a403a;
  --bubble-me: #1d4a38; --bubble: #1d322d; --accent-ink: #5fd68a; --warn: #f0a24b; --danger: #ff7a7a; --info: #8fb2ff; color-scheme: dark }
html, body { height: 100% }
body { margin: 0 }
[hidden] { display: none !important }
img { max-width: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; display: flex; flex-direction: column }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand) }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.wrap { width: 100%; max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box }

/* Kopf + Navigation */
header.top { background: var(--brand); color: #fff; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px 6px }
.title { font-weight: 750; font-size: 17px; white-space: nowrap }
.title small { font-weight: 400; opacity: .75; font-size: 12px; margin-left: 4px }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0 }
.me select { background: rgba(255,255,255,.14); border: 0; border-radius: 10px; padding: 4px 8px; color: #fff; max-width: 170px }
.me select option { color: #000 }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding-block: 0 6px }
nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; color: rgba(255,255,255,.78); text-decoration: none; font-size: 12.5px; font-weight: 600; position: relative }
nav.tabs a svg { width: 22px; height: 22px }
nav.tabs a.on { background: rgba(255,255,255,.16); color: #fff }
.badge { position: absolute; top: 2px; right: calc(50% - 22px); background: var(--danger); color: #fff; border-radius: 9px; font-size: 11px; min-width: 18px; height: 18px; line-height: 18px; text-align: center; padding: 0 4px; box-sizing: border-box }
.demo-bar { background: #fff3cd; color: #5c4400; font-size: 12.5px }
.demo-bar .wrap { padding-block: 6px }

main { flex: 1; min-height: 0; overflow-y: auto }
section.view { padding-block: 14px 24px; display: flex; flex-direction: column; gap: 12px }
h2 { margin: 0; font-size: 19px; text-wrap: balance }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px }
.muted { color: var(--muted); font-size: 13px }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.btn { border: 0; border-radius: 10px; padding: 11px 14px; font-weight: 650; background: var(--brand-2); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none }
.btn.big { padding: 15px; font-size: 16px; width: 100% }
.btn.green { background: var(--accent-ink) }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line) }
.btn.danger { background: var(--danger) }
.btn.zoom { background: #2d8cff }
.btn:disabled { opacity: .5; cursor: default }
.btn svg { width: 20px; height: 20px }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); flex: 1; min-width: 140px }
label.f input, label.f select { font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--fg) }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 14px }
.empty { text-align: center; color: var(--muted); padding: 26px 10px }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: 0 0 auto; font-size: 15px }

/* Chat */
#view-chat { height: 100%; padding-block: 0; gap: 0 }
.chat-list { display: flex; flex-direction: column; gap: 8px; padding-block: 14px }
.ch { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; text-align: left; width: 100% }
.ch .t { flex: 1; min-width: 0 }
.ch .t b { display: block }
.ch .t span { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.ch .n { background: var(--accent-ink); color: #fff; border-radius: 10px; font-size: 12px; padding: 2px 7px; font-weight: 700 }
.conv { display: flex; flex-direction: column; height: 100% }
.conv-head { display: flex; align-items: center; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line) }
.conv-head b { flex: 1; min-width: 0 }
.msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-block: 12px }
.day { align-self: center; font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 2px 10px; margin: 6px 0 }
.m { max-width: 82%; align-self: flex-start; background: var(--bubble); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 7px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.m.me { align-self: flex-end; background: var(--bubble-me); border-radius: 14px 14px 4px 14px }
.m .who { font-size: 12.5px; font-weight: 700; display: flex; gap: 8px; justify-content: space-between }
.m .who time { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums }
.m .txt { white-space: pre-wrap; overflow-wrap: anywhere }
.m img { border-radius: 9px; max-height: 240px; object-fit: cover; cursor: zoom-in; background: var(--line) }
.file { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.05); border-radius: 9px; padding: 8px; text-decoration: none; color: var(--fg) }
.file svg { width: 26px; height: 26px; flex: 0 0 auto; color: var(--danger) }
.file span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.file small { color: var(--muted); white-space: nowrap }
.composer { display: flex; gap: 8px; align-items: flex-end; padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line) }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 20px; padding: 10px 14px; font-size: 16px; max-height: 120px; background: var(--card) }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--card); color: var(--fg); border: 1px solid var(--line); flex: 0 0 auto }
.icon-btn.send { background: var(--accent-ink); color: #fff; border: 0 }
.icon-btn svg { width: 22px; height: 22px }
.pending { display: flex; align-items: center; gap: 8px; font-size: 13px; padding-top: 8px }
.pending img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px }

/* Team */
.person { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; width: 100%; text-align: left }
.person .t { flex: 1; min-width: 0 }
.pill { font-size: 11.5px; font-weight: 700; border-radius: 8px; padding: 2px 7px; background: rgba(29,78,216,.12); color: var(--info) }
.pill.off { background: rgba(189,33,33,.12); color: var(--danger) }
.sheet { position: fixed; inset: 0; background: rgba(10,30,25,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20 }
.sheet .panel { background: var(--bg); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; max-height: 88%; overflow-y: auto; box-sizing: border-box }
.confirm { background: rgba(189,33,33,.08); border: 1px solid var(--danger); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px }

/* Dashboard */
.month { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.month b { font-size: 17px }
.total { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap }
.total .big { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1 }
.bar { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .4s }
.rank { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 10px; align-items: center }
.rank .nm { font-weight: 600; min-width: 0 }
.rank .ct { font-variant-numeric: tabular-nums; font-weight: 750; text-align: right }
.rank .bar { grid-column: 2 / 4; height: 6px; margin-top: -4px }
.mine li { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line) }
.mine { list-style: none; margin: 0; padding: 0 }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--brand); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px) }
.viewer { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: grid; place-items: center; z-index: 40 }
.viewer img { max-width: 96%; max-height: 92% }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none } }
</style>
</head>

<header class="top">
  <div class="wrap">
    <span class="title">Hauskarte BW <small>Team</small></span>

  <nav class="tabs" aria-label="Hauptnavigation">

      <a href="#chat" id="tab-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Team-Chat<span class="badge" id="unread" hidden></span></a>

      <a href="#dashboard" id="tab-dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Dashboard</a>
    </div>
  </nav>
</header>
<div class="demo-bar" id="demoBar" hidden><div class="wrap">Vorschau mit Beispieldaten. Nichts hier wird gespeichert oder an euren Server gesendet. Oben rechts kannst du wechseln, als wer du angemeldet bist.</div></div>
<main id="main">
  <section class="view wrap" id="view-map" hidden></section>
  <section class="view wrap" id="view-chat" hidden></section>
  <section class="view wrap" id="view-team" hidden></section>
  <section class="view wrap" id="view-dashboard" hidden></section>

</main>
<input type="file" id="filePick" hidden>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const h = (tag, props = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? '' : v); } e.append(...kids.flat().filter(x => x !== null && x !== undefined && x !== false)); return e; };
const svg = path => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); s.innerHTML = path; return s; };
const I = {
  clip: '<path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/>',
  send: '<path d="M4 12 20 4l-4 16-4-7z"/><path d="m12 13 8-9"/>',
  back: '<path d="M15 5 8 12l7 7"/>',
  video: '<rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="m15.5 10 6-3v10l-6-3"/>',
  file: '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  msg: '<path d="M4 5h16v11H9l-5 4z"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>'
};
const COLORS = ['#1f7a45', '#1d4ed8', '#b45309', '#7c3aed', '#be185d', '#0f766e', '#a16207', '#4d7c0f'];
const avColor = id => COLORS[[...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const initials = n => n.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const av = u => h('span', { class: 'av', style: 'background:' + avColor(u.id) }, initials(u.name || '?'));
const pad = n => String(n).padStart(2, '0');
const monthKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const monthName = k => { const [y, m] = k.split('-'); return MONTHS[+m - 1] + ' ' + y; };
const shiftMonth = (k, n) => { const [y, m] = k.split('-').map(Number); return monthKey(new Date(y, m - 1 + n, 1)); };
const time = iso => new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const dayLabel = iso => { const d = new Date(iso), t = new Date(); const y = new Date(); y.setDate(t.getDate() - 1); if (d.toDateString() === t.toDateString()) return 'Heute'; if (d.toDateString() === y.toDateString()) return 'Gestern'; return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }); };
const size = b => b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(1).replace('.', ',') + ' MB';
const store = { get(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let toastT = 0;
function toast(t) { document.querySelector('.toast')?.remove(); const e = h('div', { class: 'toast', role: 'status' }, t); document.body.append(e); clearTimeout(toastT); toastT = setTimeout(() => e.remove(), 2600); }
const MAX_FILE = 25 * 1048576;

/* ================= Datenzugriff =================
   Echtbetrieb: Server auf dem Büro-Laptop (gleiche Anmeldung wie die Hauskarte).
   Vorschau: Beispieldaten im Speicher, nichts verlässt das Gerät. */
const DEMO = !/\.ts\.net$|^localhost$|^127\.0\.0\.1$/.test(location.hostname) || /[?&]demo\b/.test(location.search);

const AUTHKEY = 'hauskarte-bw-sync-auth';
let auth = store.get(AUTHKEY, null);
async function token() {
  if (!auth) throw Object.assign(Error('Bitte anmelden.'), { auth: true });
  if (Date.now() > auth.exp - 60000) {
    const r = await fetch('/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: auth.refresh }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { if (r.status < 500) { auth = null; store.set(AUTHKEY, null); throw Object.assign(Error('Anmeldung abgelaufen.'), { auth: true }); } throw Error('Server nicht erreichbar'); }
    auth = { ...auth, access: j.access_token, refresh: j.refresh_token, exp: Date.now() + j.expires_in * 1000 };
    store.set(AUTHKEY, auth);
  }
  return auth.access;
}
async function call(method, path, body, raw) {
  let res;
  try {
    res = await fetch('/api/' + path, { method, headers: { Authorization: 'Bearer ' + await token(), ...(raw ? raw.headers : body ? { 'Content-Type': 'application/json' } : {}) }, body: raw ? raw.body : body ? JSON.stringify(body) : undefined });
  } catch (e) { if (e.auth) throw e; throw Error('Keine Verbindung zum Server. Ist Tailscale an?'); }
  if (res.status === 401) { auth.exp = 0; store.set(AUTHKEY, auth); throw Object.assign(Error('Bitte erneut anmelden.'), { auth: true }); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw Error(j.message || 'Fehler ' + res.status);
  return j;
}
const realApi = {
  me: () => call('GET', 'me'),
  users: () => call('GET', 'users'),
  addUser: d => call('POST', 'users', d),
  updateUser: (id, d) => call('POST', 'users/' + encodeURIComponent(id), d),
  channels: () => call('GET', 'channels'),
  messages: (ch, after) => call('GET', 'messages?channel=' + encodeURIComponent(ch) + '&after=' + (after || 0)),
  send: async (ch, text, file) => {
    let attachment = null;
    if (file) attachment = (await call('POST', 'files', null, { headers: { 'Content-Type': file.type || 'application/octet-stream', 'X-Filename': encodeURIComponent(file.name) }, body: file })).id;
    return call('POST', 'messages', { channel: ch, text, attachment });
  },
  fileBlob: async att => { const r = await fetch('/api/files/' + att.id, { headers: { Authorization: 'Bearer ' + await token() } }); if (!r.ok) throw Error('Datei nicht verfügbar'); return r.blob(); },
  contracts: month => call('GET', 'contracts?month=' + month),
  addContract: note => call('POST', 'contracts', { note }),
  delContract: id => call('POST', 'contracts/' + id + '/delete'),
  setGoal: (month, goal) => call('POST', 'goals', { month, goal }),
  settings: () => call('GET', 'settings'),
  setZoom: zoom => call('POST', 'settings', { zoom })
};

/* ---------- Vorschau-Daten ---------- */
const demoApi = (() => {
  const now = new Date(), cur = monthKey(now), prev = shiftMonth(cur, -1);
  const users = [
    { id: 'u1', name: 'Neki', admin: true, active: true },
    { id: 'u2', name: 'Max', admin: false, active: true },
    { id: 'u3', name: 'Sarah', admin: false, active: true },
    { id: 'u4', name: 'Tom', admin: false, active: true },
    { id: 'u5', name: 'Lisa', admin: false, active: true }
  ];
  let meId = 'u1', seq = 0, cseq = 0;
  const at = (daysAgo, hh, mm) => { const d = new Date(); d.setDate(d.getDate() - daysAgo); d.setHours(hh, mm, 0, 0); return d.toISOString(); };
  const img = (() => { const c = document.createElement('canvas'); c.width = 480; c.height = 320; const g = c.getContext('2d'); g.fillStyle = '#dfe8e3'; g.fillRect(0, 0, 480, 320); g.strokeStyle = '#ffffff'; g.lineWidth = 26; g.beginPath(); g.moveTo(0, 200); g.lineTo(480, 140); g.moveTo(170, 0); g.lineTo(230, 320); g.stroke(); const hs = [[40, 40, '#22ba57'], [300, 40, '#f24747'], [40, 240, '#3b82f6'], [320, 210, '#22ba57'], [380, 40, '#86919b']]; for (const [x, y, c2] of hs) { g.fillStyle = c2; g.fillRect(x, y, 70, 60); } g.fillStyle = '#173a34'; g.font = 'bold 22px system-ui'; g.fillText('Beispielfoto: Gebiet Waiblingen-Süd', 18, 305); return c.toDataURL('image/jpeg', .8); })();
  const pdf = new Blob(['%PDF-1.4 Beispiel'], { type: 'application/pdf' });
  const files = { f1: { id: 'f1', name: 'Gebiet-Sued.jpg', type: 'image/jpeg', size: 48211, url: img }, f2: { id: 'f2', name: 'Preisblatt-Oktober.pdf', type: 'application/pdf', size: 182344, blob: pdf } };
  const msgs = [
    { ch: 'team', from: 'u2', text: 'Morgen zusammen! Ich übernehme heute die Bahnhofstraße bis Hausnummer 40.', at: at(1, 8, 12) },
    { ch: 'team', from: 'u3', text: 'Ich mache die Fronackerstraße. Wer hat noch Flyer?', at: at(1, 8, 20) },
    { ch: 'team', from: 'u1', text: 'Flyer liegen im Büro. Teamcall heute um 17 Uhr, Link ist oben.', at: at(1, 9, 2) },

function zoomCard() {
  const inp = h('input', { id: 'zoomLink', type: 'url', value: settings.zoom || '', placeholder: 'https://zoom.us/j/…' });
  return h('div', { class: 'card' }, h('b', {}, 'Zoom-Teamcall'), h('p', { class: 'muted', style: 'margin:0' }, 'Dieser Link öffnet sich bei allen über „Teamcall beitreten“ im Team-Chat und im Dashboard.'),
    h('div', { class: 'row', style: 'align-items:flex-end' }, h('label', { class: 'f' }, 'Zoom-Link', inp), h('button', { class: 'btn', onclick: async () => { const z = inp.value.trim(); if (z && !/^https:\/\//.test(z)) return toast('Bitte einen Link beginnend mit https:// eingeben.'); await api.setZoom(z); settings.zoom = z; toast(z ? 'Zoom-Link gespeichert.' : 'Zoom-Link entfernt.'); } }, 'Speichern')));
}

/* ================= Dashboard ================= */
let dashMonth = monthKey(new Date());
async function renderDashboard() {
  const v = $('view-dashboard');
  settings = await api.settings().catch(() => settings);
  const cur = monthKey(new Date());
  let d;
  try { d = await api.contracts(dashMonth); } catch (e) { v.replaceChildren(h('div', { class: 'empty' }, e.message)); return; }
  const isCur = dashMonth === cur;
  const first = d.months[0] || cur;
  const nav = h('div', { class: 'month' },
    h('button', { class: 'icon-btn', 'aria-label': 'Vorheriger Monat', disabled: dashMonth <= first, onclick: () => { dashMonth = shiftMonth(dashMonth, -1); renderDashboard(); } }, svg(I.back)),
    h('b', {}, monthName(dashMonth) + (isCur ? '' : ' (abgeschlossen)')),
    h('button', { class: 'icon-btn', 'aria-label': 'Nächster Monat', disabled: isCur, onclick: () => { dashMonth = shiftMonth(dashMonth, 1); renderDashboard(); } }, (() => { const s = svg(I.back); s.style.transform = 'scaleX(-1)'; return s; })()));
  const pct = d.goal ? Math.min(100, Math.round(d.total / d.goal * 100)) : 0;
  const totalCard = h('div', { class: 'card' },
    h('span', { class: 'muted' }, 'Team gesamt'),
    h('div', { class: 'total' }, h('span', { class: 'big' }, d.total), h('span', {}, d.goal ? 'von ' + d.goal + ' Verträgen' : 'Verträge')),
    d.goal ? h('div', { class: 'bar', role: 'progressbar', 'aria-valuenow': pct, 'aria-valuemin': 0, 'aria-valuemax': 100 }, h('i', { style: 'width:' + pct + '%' })) : null,
    d.goal ? h('span', { class: 'muted' }, pct + ' % vom Monatsziel' + (isCur && d.total < d.goal ? ' · noch ' + (d.goal - d.total) : '')) : null,
    me.admin ? goalEditor(d) : null);
  const myCard = h('div', { class: 'card' }, h('div', { class: 'row', style: 'justify-content:space-between' }, h('b', {}, 'Meine Verträge'), h('span', { class: 'total' }, h('span', { class: 'big', style: 'font-size:30px' }, d.myCount))));
  if (isCur) {
    const note = h('input', { id: 'contractNote', placeholder: 'Notiz (optional), z. B. Kunde oder Tarif', autocomplete: 'off' });
    const add = h('button', { class: 'btn big green' }, svg(I.plus), 'Vertrag eintragen');
    add.onclick = async () => { add.disabled = true; try { await api.addContract(note.value.trim()); toast('Vertrag für ' + me.name + ' gezählt.'); renderDashboard(); } catch (e) { toast(e.message); add.disabled = false; } };
    myCard.append(h('label', { class: 'f' }, 'Notiz', note), add, h('p', { class: 'muted', style: 'margin:0' }, 'Wird automatisch dir zugeordnet.'));
  }
  if (d.mine.length) {
    const ul = h('ul', { class: 'mine' }, d.mine.slice(0, 15).map(c => h('li', {}, h('span', {}, new Date(c.at).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' + time(c.at) + (c.note ? ' · ' + c.note : '')),
      isCur ? h('button', { class: 'btn ghost', style: 'padding:6px 10px', onclick: async () => { await api.delContract(c.id); toast('Eintrag zurückgenommen.'); renderDashboard(); } }, 'Rückgängig') : null)));
    myCard.append(ul);
  }
  let rank = null;
  if (d.users) {
    const max = Math.max(1, ...d.users.map(u => u.count));
    const grid = h('div', { class: 'rank' });
    for (const u of [...d.users].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'de'))) {
      grid.append(av(u), h('span', { class: 'nm' }, u.name), h('span', { class: 'ct' }, u.count), h('span'), h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.round(u.count / max * 100) + '%' })));
    }
    rank = h('div', { class: 'card' }, h('b', {}, 'Alle Mitarbeiter'), h('span', { class: 'muted' }, 'Nur für Administratoren sichtbar'), grid);
  }
  const zb = zoomBtn(); if (zb) zb.classList.add('big');
  v.replaceChildren(nav, totalCard, myCard, rank, zb);
}
function goalEditor(d) {
  const inp = h('input', { id: 'goal', type: 'number', min: 0, step: 1, value: d.goal || '', placeholder: 'z. B. 60' });
  return h('div', { class: 'row', style: 'align-items:flex-end' }, h('label', { class: 'f' }, 'Monatsziel für ' + monthName(d.month), inp),
    h('button', { class: 'btn ghost', onclick: async () => { const g = Math.max(0, parseInt(inp.value, 10) || 0); await api.setGoal(d.month, g); toast(g ? 'Monatsziel: ' + g + ' Verträge.' : 'Monatsziel entfernt.'); renderDashboard(); } }, 'Speichern'));
}

boot();
})();
</script>
</body>
</html>
